<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Afinador · Detector de Tons</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0f172a;
    --navy-card:#141f38;
    --navy-ring:#1c2b4d;
    --brass:#d4a24c;
    --brass-dim:#8a6c33;
    --in-tune:#3ecf8e;
    --off:#e2664a;
    --text-dim:#7c8aad;
  }
  html,body{background:var(--navy-deep);}
  body{font-family:'Inter',sans-serif;}
  .font-display{font-family:'Space Grotesk',sans-serif;}
  .font-mono{font-family:'JetBrains Mono',monospace;}

  .bg-radial{
    background: radial-gradient(circle at 50% 30%, #182548 0%, #0f172a 65%);
  }

  .dial-ring{
    background: conic-gradient(from 180deg, var(--navy-ring) 0deg, var(--navy-ring) 360deg);
  }

  .note-circle{
    background: radial-gradient(circle at 32% 28%, #1b2c52 0%, var(--navy-card) 55%, #0c1428 100%);
    box-shadow: inset 0 0 0 1px rgba(212,162,76,0.12), 0 25px 60px -20px rgba(0,0,0,0.7);
    transition: box-shadow 0.4s ease;
  }
  .note-circle.locked{
    box-shadow: inset 0 0 0 1px rgba(62,207,142,0.35), 0 0 55px -10px rgba(62,207,142,0.25), 0 25px 60px -20px rgba(0,0,0,0.7);
  }

  .needle{
    transform-origin: 50% 100%;
    transition: transform 0.12s ease-out;
  }

  #micBtn{
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.3s ease;
  }
  #micBtn:active{ transform: scale(0.96); }
  #micBtn.listening{
    background: linear-gradient(180deg, #b8863a, #8a6c33);
    box-shadow: 0 0 0 6px rgba(212,162,76,0.12);
  }

  .pulse-dot{
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:.35; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.4); }
  }

  .waveform-bar{
    transition: height 0.08s ease-out;
  }
</style>
</head>
<body class="min-h-screen bg-radial text-slate-200 flex flex-col items-center justify-between px-4 py-8 sm:py-10">

  <!-- Header -->
  <header class="w-full max-w-md flex items-center justify-between">
    <div>
      <h1 class="font-display text-lg sm:text-xl font-bold text-slate-100 tracking-tight">Afinador</h1>
      <p class="text-[11px] sm:text-xs text-[var(--text-dim)] font-mono tracking-wide">DETECTOR DE TONS · TEMPO REAL</p>
    </div>
    <div id="statusChip" class="flex items-center gap-2 text-[11px] font-mono text-[var(--text-dim)] border border-white/5 rounded-full px-3 py-1.5">
      <span id="statusDot" class="w-1.5 h-1.5 rounded-full bg-[var(--text-dim)]"></span>
      <span id="statusText">INATIVO</span>
    </div>
  </header>

  <!-- Main Dial -->
  <main class="flex-1 flex flex-col items-center justify-center w-full max-w-md py-6">

    <!-- Semicircular cents gauge -->
    <div class="relative w-64 sm:w-72 h-32 sm:h-36 mb-[-2.5rem] sm:mb-[-3rem] z-10">
      <svg viewBox="0 0 200 100" class="w-full h-full">
        <path d="M 10 100 A 90 90 0 0 1 190 100" fill="none" stroke="#1c2b4d" stroke-width="10" stroke-linecap="round"/>
        <path d="M 65 100 A 90 90 0 0 1 135 100" fill="none" stroke="#2a3d63" stroke-width="10" stroke-linecap="round"/>
        <path id="gaugeArc" d="M 95 100 A 90 90 0 0 1 105 100" fill="none" stroke="#3ecf8e" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
        <!-- tick marks -->
        <g stroke="#41527a" stroke-width="1.5">
          <line x1="100" y1="14" x2="100" y2="22"/>
          <line x1="55" y1="24" x2="60" y2="31"/>
          <line x1="145" y1="24" x2="140" y2="31"/>
          <line x1="20" y1="65" x2="27" y2="61"/>
          <line x1="180" y1="65" x2="173" y2="61"/>
        </g>
      </svg>
      <div class="absolute left-1/2 bottom-0 origin-bottom needle" id="needle" style="transform: translateX(-50%) rotate(0deg);">
        <div class="w-0.5 h-24 sm:h-28 rounded-full" style="background: linear-gradient(to top, var(--brass), rgba(212,162,76,0));"></div>
      </div>
      <div class="absolute left-1/2 bottom-0 -translate-x-1/2 w-3 h-3 rounded-full bg-[var(--brass)] shadow-[0_0_10px_var(--brass)]"></div>
    </div>

    <!-- Note circle -->
    <div id="noteCircle" class="note-circle relative w-64 h-64 sm:w-72 sm:h-72 rounded-full flex flex-col items-center justify-center border border-white/5 z-0">
      <div class="absolute top-6 sm:top-7 flex gap-1.5">
        <span id="dotLow" class="w-1.5 h-1.5 rounded-full bg-white/10"></span>
        <span id="dotMid" class="w-1.5 h-1.5 rounded-full bg-white/10"></span>
        <span id="dotHigh" class="w-1.5 h-1.5 rounded-full bg-white/10"></span>
      </div>

      <div class="flex items-end">
        <span id="noteLetter" class="font-display text-7xl sm:text-8xl font-bold text-slate-100 leading-none tracking-tight">–</span>
        <span id="noteAccidental" class="font-display text-3xl sm:text-4xl font-bold text-[var(--brass)] leading-none mb-2">&nbsp;</span>
      </div>
      <span id="noteOctave" class="font-mono text-sm text-[var(--text-dim)] mt-1">oitava —</span>

      <div class="mt-5 flex flex-col items-center">
        <span id="frequency" class="font-mono text-xl sm:text-2xl text-slate-300">0.0 <span class="text-sm text-[var(--text-dim)]">Hz</span></span>
        <span id="centsLabel" class="font-mono text-xs mt-1 text-[var(--text-dim)]">± 0 cents</span>
      </div>
    </div>

    <!-- Waveform strip -->
    <div class="mt-8 flex items-end gap-[3px] h-8 w-56 sm:w-64" id="waveform">
      <!-- bars injected by JS -->
    </div>

  </main>

  <!-- Mic Button -->
  <footer class="w-full max-w-md flex flex-col items-center gap-4">
    <button id="micBtn" class="w-full sm:w-auto sm:px-16 flex items-center justify-center gap-3 rounded-2xl bg-[var(--brass)] text-[#0f172a] font-semibold py-4 px-8 shadow-lg shadow-black/40">
      <svg id="micIcon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3z"/>
        <path d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.92V20H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.08A7 7 0 0 0 19 11z"/>
      </svg>
      <span id="micLabel">Ativar Microfone</span>
    </button>

    <div class="w-full flex flex-col gap-2 px-1">
      <div class="flex items-center justify-between text-[11px] font-mono text-[var(--text-dim)]">
        <span>SENSIBILIDADE AO RUÍDO</span>
        <span id="sensitivityValue">Média</span>
      </div>
      <input id="sensitivitySlider" type="range" min="1" max="3" step="1" value="2"
        class="w-full h-1.5 rounded-full bg-[var(--navy-ring)] accent-[var(--brass)]">
      <p class="text-[10px] text-[var(--text-dim)] font-mono">Mais alto = ignora mais ruído ambiente, mas exige um som mais forte pra detectar.</p>
    </div>

    <p class="text-[11px] text-[var(--text-dim)] font-mono text-center px-4">O áudio é processado localmente no navegador — nada é enviado a servidores.</p>
  </footer>

<script>
(() => {
  const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const REF_FREQ = 440; // A4

  let audioCtx, analyser, mediaStream, source, rafId;
  let buffer, listening = false;

  // --- Filtro de ruído / estabilidade ---
  const CLARITY_THRESHOLD = 0.35;  // voz cantada tem harmônicos/formantes e nunca chega perto de 1.0
  const HISTORY_SIZE = 6;          // quantas leituras válidas guardamos
  const MIN_AGREEING = 3;          // mínimo de leituras concordando pra travar a nota
  const STABILITY_CENTS = 35;      // tolerância entre leituras pra considerar "o mesmo tom"
  const NOISE_GATES = { 1: 0.006, 2: 0.012, 3: 0.025 }; // baixa / média / alta sensibilidade ao ruído
  let noiseGate = NOISE_GATES[2];
  let pitchHistory = [];
  let lastShownFreq = null;

  const sensitivitySlider = document.getElementById('sensitivitySlider');
  const sensitivityValue = document.getElementById('sensitivityValue');
  const SENSITIVITY_LABELS = { 1: 'Baixa', 2: 'Média', 3: 'Alta' };

  sensitivitySlider.addEventListener('input', () => {
    const level = Number(sensitivitySlider.value);
    noiseGate = NOISE_GATES[level];
    sensitivityValue.textContent = SENSITIVITY_LABELS[level];
    pitchHistory = []; // recomeça o filtro de estabilidade com o novo piso
  });

  const micBtn = document.getElementById('micBtn');
  const micLabel = document.getElementById('micLabel');
  const micIcon = document.getElementById('micIcon');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const noteCircle = document.getElementById('noteCircle');
  const noteLetter = document.getElementById('noteLetter');
  const noteAccidental = document.getElementById('noteAccidental');
  const noteOctave = document.getElementById('noteOctave');
  const frequencyEl = document.getElementById('frequency');
  const centsLabel = document.getElementById('centsLabel');
  const needle = document.getElementById('needle');
  const gaugeArc = document.getElementById('gaugeArc');
  const dotLow = document.getElementById('dotLow');
  const dotMid = document.getElementById('dotMid');
  const dotHigh = document.getElementById('dotHigh');
  const waveform = document.getElementById('waveform');

  // build waveform bars
  const BAR_COUNT = 40;
  const bars = [];
  for (let i = 0; i < BAR_COUNT; i++) {
    const bar = document.createElement('div');
    bar.className = 'waveform-bar w-1 rounded-full bg-[var(--brass-dim)]';
    bar.style.height = '2px';
    waveform.appendChild(bar);
    bars.push(bar);
  }

  function frequencyToNote(frequency) {
    const noteNum = 12 * (Math.log(frequency / REF_FREQ) / Math.log(2));
    const rounded = Math.round(noteNum) + 69; // MIDI number, A4 = 69
    const cents = Math.floor((noteNum - Math.round(noteNum)) * 100);
    return { midi: rounded, cents };
  }

  function midiToNoteName(midi) {
    const name = NOTE_NAMES[((midi % 12) + 12) % 12];
    const octave = Math.floor(midi / 12) - 1;
    return { name, octave };
  }

  function midiToFrequency(midi) {
    return REF_FREQ * Math.pow(2, (midi - 69) / 12);
  }

  // Autocorrelation-based pitch detection, com medida de clareza do sinal
  function autoCorrelate(buf, sampleRate) {
    const SIZE = buf.length;
    let rms = 0;
    for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
    rms = Math.sqrt(rms / SIZE);
    if (rms < noiseGate) return { frequency: -1, clarity: 0 }; // abaixo do piso de ruído

    let r1 = 0, r2 = SIZE - 1;
    const threshold = 0.2;
    for (let i = 0; i < SIZE / 2; i++) {
      if (Math.abs(buf[i]) < threshold) { r1 = i; break; }
    }
    for (let i = 1; i < SIZE / 2; i++) {
      if (Math.abs(buf[SIZE - i]) < threshold) { r2 = SIZE - i; break; }
    }

    const trimmed = buf.slice(r1, r2);
    const n = trimmed.length;

    const c = new Array(n).fill(0);
    for (let lag = 0; lag < n; lag++) {
      for (let i = 0; i < n - lag; i++) {
        c[lag] += trimmed[i] * trimmed[i + lag];
      }
    }

    let d = 0;
    while (c[d] > c[d + 1] && d < n - 1) d++;

    let maxVal = -1, maxPos = -1;
    for (let i = d; i < n; i++) {
      if (c[i] > maxVal) { maxVal = c[i]; maxPos = i; }
    }
    let T0 = maxPos;

    if (T0 <= 0) return { frequency: -1, clarity: 0 };

    // Clareza: o quão dominante é o pico de correlação em relação à energia total do sinal.
    // Ruído ambiente (tráfego, várias vozes, vento) gera picos fracos e espalhados -> clareza baixa.
    // Um tom puro de uma única fonte gera um pico bem definido -> clareza próxima de 1.
    const clarity = c[0] ? maxVal / c[0] : 0;

    // Parabolic interpolation for sub-sample precision
    const x1 = c[T0 - 1] || 0, x2 = c[T0], x3 = c[T0 + 1] || 0;
    const a = (x1 + x3 - 2 * x2) / 2;
    const b = (x3 - x1) / 2;
    if (a) T0 = T0 - b / (2 * a);

    return { frequency: sampleRate / T0, clarity };
  }

  // Recebe cada leitura bruta e só libera a nota pra tela quando ela é
  // consistente ao longo de várias janelas seguidas (evita "pulos" causados
  // por ruído de fundo ou por outra pessoa/som passando perto do mic).
  function processPitch(frequency, clarity) {
    const valid = frequency !== -1 && clarity >= CLARITY_THRESHOLD && frequency > 60 && frequency < 1500;

    if (!valid) {
      pitchHistory = [];
      return null;
    }

    pitchHistory.push(frequency);
    if (pitchHistory.length > HISTORY_SIZE) pitchHistory.shift();

    if (pitchHistory.length < MIN_AGREEING) return lastShownFreq;

    const sorted = [...pitchHistory].sort((a, b) => a - b);
    const median = sorted[Math.floor(sorted.length / 2)];

    const agreeing = pitchHistory.filter(
      f => Math.abs(1200 * Math.log2(f / median)) < STABILITY_CENTS
    ).length;

    if (agreeing < MIN_AGREEING) {
      // leituras discordando entre si -> provavelmente ruído, descarta as mais antigas
      pitchHistory = pitchHistory.slice(-2);
      return lastShownFreq;
    }

    lastShownFreq = median;
    return median;
  }

  function updateWaveform(dataArray) {
    const step = Math.floor(dataArray.length / BAR_COUNT);
    for (let i = 0; i < BAR_COUNT; i++) {
      const v = Math.abs(dataArray[i * step] - 128) / 128; // 0..1
      const h = Math.max(2, v * 32);
      bars[i].style.height = h + 'px';
    }
  }

  function resetDisplay() {
    noteLetter.textContent = '–';
    noteAccidental.textContent = '\u00A0';
    noteOctave.textContent = 'oitava —';
    frequencyEl.innerHTML = '0.0 <span class="text-sm text-[var(--text-dim)]">Hz</span>';
    centsLabel.textContent = '± 0 cents';
    centsLabel.className = 'font-mono text-xs mt-1 text-[var(--text-dim)]';
    needle.style.transform = 'translateX(-50%) rotate(0deg)';
    gaugeArc.setAttribute('stroke', '#3ecf8e');
    noteCircle.classList.remove('locked');
    [dotLow, dotMid, dotHigh].forEach(d => d.className = 'w-1.5 h-1.5 rounded-full bg-white/10');
    bars.forEach(b => b.style.height = '2px');
  }

  function updateDisplay(freq) {
    if (freq === -1 || !freq || freq < 40 || freq > 2000) {
      [dotLow, dotMid, dotHigh].forEach(d => d.className = 'w-1.5 h-1.5 rounded-full bg-white/10');
      noteCircle.classList.remove('locked');
      return;
    }

    const { midi, cents } = frequencyToNote(freq);
    const { name, octave } = midiToNoteName(midi);
    const hasSharp = name.includes('#');
    const letter = hasSharp ? name[0] : name;

    noteLetter.textContent = letter;
    noteAccidental.textContent = hasSharp ? '\u266F' : '\u00A0';
    noteOctave.textContent = 'oitava ' + octave;
    frequencyEl.innerHTML = freq.toFixed(1) + ' <span class="text-sm text-[var(--text-dim)]">Hz</span>';

    const sign = cents > 0 ? '+' : '';
    centsLabel.textContent = sign + cents + ' cents';

    // Needle: -50 to +50 cents mapped to -80deg .. +80deg
    const clamped = Math.max(-50, Math.min(50, cents));
    const angle = (clamped / 50) * 80;
    needle.style.transform = `translateX(-50%) rotate(${angle}deg)`;

    const inTune = Math.abs(cents) <= 5;
    const close = Math.abs(cents) <= 15;

    if (inTune) {
      gaugeArc.setAttribute('stroke', '#3ecf8e');
      centsLabel.className = 'font-mono text-xs mt-1 text-[var(--in-tune)] font-semibold';
      noteCircle.classList.add('locked');
      dotLow.className = 'w-1.5 h-1.5 rounded-full bg-[var(--in-tune)]';
      dotMid.className = 'w-1.5 h-1.5 rounded-full bg-[var(--in-tune)]';
      dotHigh.className = 'w-1.5 h-1.5 rounded-full bg-[var(--in-tune)]';
    } else if (close) {
      gaugeArc.setAttribute('stroke', '#d4a24c');
      centsLabel.className = 'font-mono text-xs mt-1 text-[var(--brass)]';
      noteCircle.classList.remove('locked');
      dotLow.className = 'w-1.5 h-1.5 rounded-full ' + (cents < 0 ? 'bg-[var(--brass)]' : 'bg-white/10');
      dotMid.className = 'w-1.5 h-1.5 rounded-full bg-white/10';
      dotHigh.className = 'w-1.5 h-1.5 rounded-full ' + (cents > 0 ? 'bg-[var(--brass)]' : 'bg-white/10');
    } else {
      gaugeArc.setAttribute('stroke', '#e2664a');
      centsLabel.className = 'font-mono text-xs mt-1 text-[var(--off)]';
      noteCircle.classList.remove('locked');
      dotLow.className = 'w-1.5 h-1.5 rounded-full ' + (cents < 0 ? 'bg-[var(--off)]' : 'bg-white/10');
      dotMid.className = 'w-1.5 h-1.5 rounded-full bg-white/10';
      dotHigh.className = 'w-1.5 h-1.5 rounded-full ' + (cents > 0 ? 'bg-[var(--off)]' : 'bg-white/10');
    }
  }

  function loop() {
    analyser.getFloatTimeDomainData(buffer);
    const { frequency, clarity } = autoCorrelate(buffer, audioCtx.sampleRate);
    const stableFreq = processPitch(frequency, clarity);
    updateDisplay(stableFreq === null ? -1 : stableFreq);

    const byteData = new Uint8Array(analyser.fftSize);
    analyser.getByteTimeDomainData(byteData);
    updateWaveform(byteData);

    rafId = requestAnimationFrame(loop);
  }

  async function startListening() {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false
        }
      });

      source = audioCtx.createMediaStreamSource(mediaStream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 4096;
      analyser.smoothingTimeConstant = 0;
      buffer = new Float32Array(analyser.fftSize);
      source.connect(analyser);

      pitchHistory = [];
      lastShownFreq = null;
      listening = true;
      micLabel.textContent = 'Parar Detecção';
      micBtn.classList.add('listening');
      statusText.textContent = 'ESCUTANDO';
      statusDot.className = 'w-1.5 h-1.5 rounded-full bg-[var(--in-tune)] pulse-dot';
      micIcon.innerHTML = '<path d="M6 6h12v12H6z"/>';

      loop();
    } catch (err) {
      statusText.textContent = 'ERRO: SEM ACESSO AO MIC';
      statusDot.className = 'w-1.5 h-1.5 rounded-full bg-[var(--off)]';
      console.error('Erro ao acessar microfone:', err);
    }
  }

  function stopListening() {
    listening = false;
    pitchHistory = [];
    lastShownFreq = null;
    if (rafId) cancelAnimationFrame(rafId);
    if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
    if (audioCtx) audioCtx.close();

    micLabel.textContent = 'Ativar Microfone';
    micBtn.classList.remove('listening');
    statusText.textContent = 'INATIVO';
    statusDot.className = 'w-1.5 h-1.5 rounded-full bg-[var(--text-dim)]';
    micIcon.innerHTML = '<path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3z"/><path d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.92V20H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.08A7 7 0 0 0 19 11z"/>';

    resetDisplay();
  }

  micBtn.addEventListener('click', () => {
    if (!listening) startListening();
    else stopListening();
  });
})();
</script>
</body>
</html>
